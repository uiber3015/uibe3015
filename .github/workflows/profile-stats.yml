name: Update profile showcase

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - README.md

permissions:
  contents: write

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh the showcase
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USERNAME: uiber3015
        run: python scripts/update_profile_stats.py

      - name: Commit the showcase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats.svg assets/stats-dark.svg
          git diff --cached --quiet && exit 0
          git commit -m "Refresh profile showcase"
          git push
