name: Update profile showcase

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - README.md

permissions:
  contents: write

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh stat cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USERNAME: uiber3015
        run: python scripts/update_profile_stats.py

      - name: Commit stat cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-row.svg assets/stats-row-dark.svg assets/public.json assets/private.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh profile stat cards"
          git push
